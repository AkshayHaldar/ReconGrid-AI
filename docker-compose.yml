version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: recongrid-postgres
    environment:
      POSTGRES_USER: recongrid
      POSTGRES_PASSWORD: recongrid
      POSTGRES_DB: recongrid
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recongrid"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: recongrid-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
