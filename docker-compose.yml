services:
  postgres:
    image: postgres:15-alpine
    container_name: recongrid-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recongrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recongrid}
      POSTGRES_DB: ${POSTGRES_DB:-recongrid}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recongrid}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: recongrid-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recongrid-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://recongrid:recongrid@postgres:5432/recongrid}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - ENV=${ENV:-development}
      - IS_TEST_MODE=${IS_TEST_MODE:-false}
      - ENABLE_DEMO=${ENABLE_DEMO:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recongrid-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:

