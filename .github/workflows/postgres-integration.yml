name: PostgreSQL Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  postgres-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: recongrid
          POSTGRES_PASSWORD: recongrid
          POSTGRES_DB: recongrid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recongrid -d recongrid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://recongrid:recongrid@localhost:5432/recongrid
      ENV: development
      ENABLE_DEMO: "true"
      RAZORPAY_WEBHOOK_SECRET: ci-test-webhook-secret #Test-only value

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run PostgreSQL integration tests
        run: |
          pytest --postgres backend/tests/integration