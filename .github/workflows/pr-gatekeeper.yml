name: PR Gatekeeper & Label Mirror

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch: # Allows manual trigger from the Actions tab to backfill closed PRs

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  mirror-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror labels from linked issue to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const issueRegex = /(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+(?:https:\/\/github\.com\/[^/]+\/[^/]+\/issues\/|#)(\d+)/gi;

            async function syncPrLabels(pr) {
              const body = pr.body || '';
              issueRegex.lastIndex = 0;
              let match;
              const linkedIssueNumbers = new Set();

              while ((match = issueRegex.exec(body)) !== null) {
                if (match[1]) {
                  linkedIssueNumbers.add(parseInt(match[1], 10));
                }
              }

              if (linkedIssueNumbers.size === 0) {
                console.log(`PR #${pr.number}: No linked issues found in description.`);
                return;
              }

              for (const issueNumber of linkedIssueNumbers) {
                try {
                  const { data: issue } = await github.rest.issues.get({
                    owner,
                    repo,
                    issue_number: issueNumber,
                  });

                  const issueLabels = issue.labels
                    .map(label => (typeof label === 'string' ? label : label.name))
                    .filter(Boolean);

                  if (issueLabels.length > 0) {
                    console.log(`Adding labels to PR #${pr.number}:`, issueLabels);
                    await github.rest.issues.addLabels({
                      owner,
                      repo,
                      issue_number: pr.number,
                      labels: issueLabels,
                    });
                  }
                } catch (err) {
                  console.error(`Error on PR #${pr.number} for issue #${issueNumber}:`, err.message);
                }
              }
            }

            if (context.eventName === 'workflow_dispatch') {
              // Backfill recent closed PRs
              console.log('Running backfill for closed PRs...');
              const { data: closedPrs } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'closed',
                per_page: 30,
              });

              for (const pr of closedPrs) {
                console.log(`Backfilling PR #${pr.number}: ${pr.title}`);
                await syncPrLabels(pr);
              }
            } else if (context.payload.pull_request) {
              await syncPrLabels(context.payload.pull_request);
            }
